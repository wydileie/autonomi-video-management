[package]
name = "antd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
ant-core = "=0.8.1"
self_encryption = "=0.36.0"
ant-protocol = "=2.3.5"
alloy = { version = "2.4.2", default-features = false, features = ["std", "consensus", "eips", "network", "provider-http", "reqwest-rustls-tls", "rpc-types", "signer-local", "sol-types"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "json"] }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4"] }
autvid_common = { path = "../common" }
axum.workspace = true
base64.workspace = true
bytes.workspace = true
hex = "0.4"
futures-util = "0.3"
rmp-serde = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile = "3"
thiserror = "2"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "signal"] }
tower-http = { workspace = true, features = ["cors", "request-id", "timeout", "trace", "util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zeroize = "1"
url = "2.5.8"
