name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_devcontainer:
        description: Build and verify the complete developer container
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  devcontainer:
    name: Full developer container build and tool checks
    if: github.event_name == 'workflow_dispatch' && inputs.build_devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build developer container
        run: docker build --progress=plain -t autvid-devcontainer:ci -f .devcontainer/Dockerfile .devcontainer

      - name: Verify installed tools as the development user
        run: |
          docker run --rm --user vscode \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            autvid-devcontainer:ci bash -lc '
              set -euo pipefail
              cd /workspace
              python3 scripts/check-runtime-versions.py
              python3 -c "import json, subprocess; p=json.load(open(\"deploy/versions.json\")); assert subprocess.check_output([\"node\", \"--version\"], text=True).strip() == \"v\" + p[\"node\"]; assert subprocess.check_output([\"rustc\", \"--version\"], text=True).split()[1] == p[\"rust\"]"
              npm --version
              python3 -m pip check
              python3 -c "import git; print(git.__version__)"
              /usr/local/py-utils/venvs/black/bin/black --version
              cargo deny --version
              anvil --version
              ant --help >/dev/null
              ant-devnet --help >/dev/null
              antd-upstream --help >/dev/null
              command -v antd-mcp uvx docker gh
            '

  rust-workspace:
    name: Rust workspace checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run cargo tests
        run: make test-rust

      - name: Run clippy
        run: make clippy-rust

  cargo-deny:
    name: Cargo deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  desktop-check:
    name: Desktop app compile check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      # tauri-build validates every configured externalBin and bundle
      # resource during cargo check; stage empty host-triple sidecars and an
      # empty frontend dist directory so a compile-only check can pass.
      - name: Stage dummy sidecars and frontend dist for compile check
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          for name in antd rust_admin rust_stream ffmpeg ffprobe; do
            install -m 0755 /dev/null "apps/desktop/src-tauri/binaries/${name}-${triple}"
          done
          mkdir -p apps/web/build

      - name: Check desktop formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Check desktop app
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  rust-admin-db:
    name: Rust admin SQLite integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2.9.3

      - name: Run rust_admin DB integration tests
        run: cargo test --locked -p rust_admin --features db-tests db_tests -- --test-threads=1

  react-frontend:
    name: React frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Lint
        run: npm run lint
        working-directory: apps/web

      - name: Check formatting
        run: npm run format:check
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web

      - name: Run tests
        run: npm test
        working-directory: apps/web
        env:
          CI: "true"

      - name: Run coverage
        run: npm run test:coverage
        working-directory: apps/web
        env:
          CI: "true"

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v7
        with:
          files: apps/web/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  coverage-rust:
    name: Rust coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2.9.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate Rust coverage
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info

      - name: Upload Rust coverage
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: false

  compose-config:
    name: Compose config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate every Compose deployment mode
        run: make compose-config

      - name: Check runtime pins and security tooling
        run: |
          sudo apt-get update && sudo apt-get install -y sqlite3
          make check-runtime

  security-audit:
    name: Security audits (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install React dependencies
        run: npm ci
        working-directory: apps/web

      - name: Audit all web dependencies
        run: npm audit
        working-directory: apps/web

      - name: Audit desktop dependencies
        run: npm ci && npm audit
        working-directory: apps/desktop

      - name: Audit desktop Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          arguments: --all-features --config deny.toml
          command: check
          command-arguments: advisories

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivyignores: .trivyignore.yaml
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

  image-scans:
    name: Blocking container image scans
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - tag: autvid-rust-admin:ci
            dockerfile: crates/rust_admin/Dockerfile
            context: .
          - tag: autvid-rust-stream:ci
            dockerfile: crates/rust_stream/Dockerfile
            context: .
          - tag: autvid-antd-service:ci
            dockerfile: crates/antd_service/Dockerfile
            context: .
          - tag: autvid-nginx:ci
            dockerfile: Dockerfile
            context: ./deploy/nginx
          - tag: autvid-react-frontend:ci
            dockerfile: Dockerfile
            context: ./apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t "${{ matrix.image.tag }}" -f "${{ matrix.image.context }}/${{ matrix.image.dockerfile }}" "${{ matrix.image.context }}"

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image.tag }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

  e2e:
    name: End-to-end Playwright against local devnet
    # Too heavy per-PR: full stack boot + real transcode pipeline. Runs on main
    # pushes, nightly, and on demand. Treat as advisory until a week of green.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare env file
        run: cp .env.local.example .env.local

      - name: Boot the reviewed gateway and devnet sources
        run: docker compose --env-file .env.local -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml up -d --build --wait
        timeout-minutes: 90

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
        working-directory: apps/web

      - name: Generate test fixture
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc=size=640x360:rate=24 \
            -f lavfi -i sine=frequency=880:sample_rate=44100 \
            -t 4 -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -movflags +faststart /tmp/e2e-sample.mp4

      - name: Run Playwright e2e
        run: npm run e2e
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost
          E2E_VIDEO_PATH: /tmp/e2e-sample.mp4

      - name: Verify upload, payment approval, and streaming
        run: make smoke-local
        timeout-minutes: 30

      - name: Verify admin restart recovery
        run: make smoke-local-restart
        timeout-minutes: 30

      - name: Verify large original upload
        run: make smoke-local-large-original
        timeout-minutes: 30

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/

      - name: Dump compose logs
        if: failure()
        run: docker compose --env-file .env.local -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml logs --tail 200

      - name: Stop test stack and remove temporary containers
        if: always()
        run: make down-local
