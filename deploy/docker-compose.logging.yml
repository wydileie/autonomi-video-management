x-app-logging: &app-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.project,com.docker.compose.service"

services:
  rust_admin:
    logging: *app-logging
  rust_stream:
    logging: *app-logging
  nginx:
    logging: *app-logging
  antd:
    logging: *app-logging
  # This overlay is intended to be layered with docker-compose.monitoring.yml so
  # Grafana gets both the Prometheus dashboards and the Loki datasource.
  loki:
    image: "${LOKI_IMAGE:-grafana/loki:3.7.7}"
    container_name: autvid_loki
    command:
      - "-config.file=/etc/loki/config.yml"
    ports:
      - "${LOKI_HTTP_BIND:-127.0.0.1}:${LOKI_HTTP_PORT:-3100}:3100"
    networks:
      - appnet
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - loki_data:/loki
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  alloy:
    image: "${ALLOY_IMAGE:-grafana/alloy:v1.19.2}"
    container_name: autvid_alloy
    environment:
      AUTVID_COMPOSE_PROJECT: "${COMPOSE_PROJECT_NAME:-autonomi-video-management}"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    ports:
      - "${ALLOY_HTTP_BIND:-127.0.0.1}:${ALLOY_HTTP_PORT:-12345}:12345"
    networks:
      - appnet
    volumes:
      - ${AUTVID_DOCKER_LOG_ROOT:-/var/lib/docker/containers}:/var/log/docker:ro
      - ./monitoring/alloy:/etc/alloy:ro
      - alloy_data:/var/lib/alloy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  grafana:
    depends_on:
      - prometheus
      - loki

volumes:
  grafana_data:
  loki_data:
  alloy_data:
